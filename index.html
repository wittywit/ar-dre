  ul { list-style: none; padding: 0; margin: 0; }
  li { border: 1px solid var(--border); margin-bottom: 12px; }
  a { display: block; padding: 16px 18px; color: var(--ink); text-decoration: none; }
  a:hover { background: var(--ink); color: var(--bg); }
  .label { font-family: 'Courier New', monospace; font-size: 0.8em; color: var(--muted); display: block; margin-bottom: 4px; }
  a:hover .label { color: #cccccc; }
